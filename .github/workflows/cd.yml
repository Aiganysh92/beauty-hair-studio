name: Beauty Hair Studio CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/beauty-hair-studio
            git fetch origin
            git checkout main
            git reset --hard origin/main

            docker build -t beauty-hair-studio .

            docker rm -f beauty-hair-container || true

            docker run -d \
              --name beauty-hair-container \
              -p 8080:80 \
              beauty-hair-studio
